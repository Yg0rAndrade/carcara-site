      - main [ref=f2e97]:
        - heading "O que é o Carcará Code" [level=1] [ref=f2e100]
        - generic [ref=f2e102]:
          - generic [ref=f2e103]:
            - generic [ref=f2e104]:
              - heading "Pra que serve" [level=2] [ref=f2e105]
              - link "Seção intitulada “Pra que serve”" [ref=f2e106] [cursor=pointer]:
                - /url: "#pra-que-serve"
            - paragraph [ref=f2e111]: O Carcará Code é um programa para o seu computador que deixa você criar sites, aplicativos e sisteminhas conversando com uma inteligência artificial, como se fosse um bate-papo. Você escreve com suas palavras o que quer (“faça uma página para a minha loja com os produtos e um botão de contato”) e a IA constrói para você. Você não precisa saber programar. Você fala, ela faz.
            - paragraph [ref=f2e112]: "Pense nele como um ajudante que sabe programar e fica sentado do seu lado. Você é o chefe: dá as ideias e vai pedindo mudanças. Ele faz o trabalho pesado."
            - generic [ref=f2e113]:
              - heading "Como é a tela (as três partes)" [level=2] [ref=f2e114]
              - link "Seção intitulada “Como é a tela (as três partes)”" [ref=f2e115] [cursor=pointer]:
                - /url: "#como-é-a-tela-as-três-partes"
            - paragraph [ref=f2e120]: "Quando você abre um projeto, a tela se divide em três partes, da esquerda para a direita:"
            - list [ref=f2e121]:
              - listitem [ref=f2e122]:
                - strong [ref=f2e123]: A barra lateral (o “rail”)
                - text: fica na ponta esquerda. É a lista dos seus projetos. Cada projeto é uma ideia diferente sua. Você clica em um para abri-lo.
              - listitem [ref=f2e124]:
                - strong [ref=f2e125]: O chat
                - text: ", no meio, é onde você conversa com a IA. É aqui que você digita o que quer e acompanha o que ela está fazendo."
              - listitem [ref=f2e126]:
                - strong [ref=f2e127]: O preview
                - text: ", à direita, é a prévia ao vivo. É o seu site ou app aparecendo de verdade, já funcionando. Cada vez que a IA muda algo, essa prévia atualiza sozinha, na hora."
            - generic [ref=f2e128]:
              - heading "O que você consegue fazer" [level=2] [ref=f2e129]
              - link "Seção intitulada “O que você consegue fazer”" [ref=f2e130] [cursor=pointer]:
                - /url: "#o-que-você-consegue-fazer"
            - list [ref=f2e135]:
              - listitem [ref=f2e136]: Criar um projeto do zero, mesmo sem ter nenhum arquivo pronto.
              - listitem [ref=f2e137]: Pedir mudanças conversando, quantas vezes quiser, até ficar do seu jeito.
              - listitem [ref=f2e138]: Ver o resultado ao vivo, sem precisar abrir outro programa.
              - listitem [ref=f2e139]: Tocar vários projetos ao mesmo tempo, cada um na sua “gavetinha” na barra lateral.
            - generic [ref=f2e140]:
              - heading "Por onde começar" [level=2] [ref=f2e141]
              - link "Seção intitulada “Por onde começar”" [ref=f2e142] [cursor=pointer]:
                - /url: "#por-onde-começar"
            - paragraph [ref=f2e147]: "Se você acabou de conhecer o Carcará, o caminho é simples:"
            - list [ref=f2e148]:
              - listitem [ref=f2e149]: Instale o programa no seu computador (a próxima página ensina o passo a passo).
              - listitem [ref=f2e150]: Prepare o PC com as ferramentas que ele usa (a gente te guia, é rápido).
              - listitem [ref=f2e151]: Crie o seu primeiro projeto e comece a conversar com a IA.
            - generic [ref=f2e152]:
              - heading "Dica" [level=2] [ref=f2e153]
