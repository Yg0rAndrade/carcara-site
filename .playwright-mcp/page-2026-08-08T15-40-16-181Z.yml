        - heading "O que é o Carcará Code" [level=1] [ref=f7e99]
        - generic [ref=f7e101]:
          - generic [ref=f7e102]:
            - generic [ref=f7e103]:
              - heading "Pra que serve" [level=2] [ref=f7e104]
              - link "Seção intitulada “Pra que serve”" [ref=f7e105] [cursor=pointer]:
                - /url: "#pra-que-serve"
            - paragraph [ref=f7e110]: O Carcará Code é um programa para o seu computador que deixa você criar sites, aplicativos e sisteminhas conversando com uma inteligência artificial, como se fosse um bate-papo. Você escreve com suas palavras o que quer (“faça uma página para a minha loja com os produtos e um botão de contato”) e a IA constrói para você. Você não precisa saber programar. Você fala, ela faz.
            - paragraph [ref=f7e111]: "Pense nele como um ajudante que sabe programar e fica sentado do seu lado. Você é o chefe: dá as ideias e vai pedindo mudanças. Ele faz o trabalho pesado."
            - generic [ref=f7e112]:
              - heading "Como é a tela (as três partes)" [level=2] [ref=f7e113]
              - link "Seção intitulada “Como é a tela (as três partes)”" [ref=f7e114] [cursor=pointer]:
                - /url: "#como-é-a-tela-as-três-partes"
            - paragraph [ref=f7e119]: "Quando você abre um projeto, a tela se divide em três partes, da esquerda para a direita:"
            - list [ref=f7e120]:
              - listitem [ref=f7e121]:
                - strong [ref=f7e122]: A barra lateral (o “rail”)
                - text: fica na ponta esquerda. É a lista dos seus projetos. Cada projeto é uma ideia diferente sua. Você clica em um para abri-lo.
              - listitem [ref=f7e123]:
                - strong [ref=f7e124]: O chat
                - text: ", no meio, é onde você conversa com a IA. É aqui que você digita o que quer e acompanha o que ela está fazendo."
              - listitem [ref=f7e125]:
                - strong [ref=f7e126]: O preview
                - text: ", à direita, é a prévia ao vivo. É o seu site ou app aparecendo de verdade, já funcionando. Cada vez que a IA muda algo, essa prévia atualiza sozinha, na hora."
            - generic [ref=f7e127]:
              - heading "O que você consegue fazer" [level=2] [ref=f7e128]
              - link "Seção intitulada “O que você consegue fazer”" [ref=f7e129] [cursor=pointer]:
                - /url: "#o-que-você-consegue-fazer"
            - list [ref=f7e134]:
              - listitem [ref=f7e135]: Criar um projeto do zero, mesmo sem ter nenhum arquivo pronto.
              - listitem [ref=f7e136]: Pedir mudanças conversando, quantas vezes quiser, até ficar do seu jeito.
              - listitem [ref=f7e137]: Ver o resultado ao vivo, sem precisar abrir outro programa.
              - listitem [ref=f7e138]: Tocar vários projetos ao mesmo tempo, cada um na sua “gavetinha” na barra lateral.
            - generic [ref=f7e139]:
              - heading "Por onde começar" [level=2] [ref=f7e140]
              - link "Seção intitulada “Por onde começar”" [ref=f7e141] [cursor=pointer]:
                - /url: "#por-onde-começar"
            - paragraph [ref=f7e146]: "Se você acabou de conhecer o Carcará, o caminho é simples:"
            - list [ref=f7e147]:
              - listitem [ref=f7e148]: Instale o programa no seu computador (a próxima página ensina o passo a passo).
              - listitem [ref=f7e149]: Prepare o PC com as ferramentas que ele usa (a gente te guia, é rápido).
              - listitem [ref=f7e150]: Crie o seu primeiro projeto e comece a conversar com a IA.
            - generic [ref=f7e151]:
              - heading "Dica" [level=2] [ref=f7e152]
