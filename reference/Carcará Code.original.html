    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const blobUrls = {};

      const entry = manifest[uuid];

            const reader = ds.readable.getReader();

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

>\n            <div style=\"margin-top:6px; height:30px; width:128px; border-radius:8px; background:{{ activeColor }};\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#8A8073; margin:16px 0 0; text-align:center; line-height:1.6;\">o rail varre sua pasta raiz. cada subpasta vira um projeto, e o que está ativo acende em <span style=\"color:#C5821C;\">dourado<\u002Fspan>.<\u002Fp>\n<\u002Fsection>\n\n<!-- ESSENCIAL -->\n<section style=\"padding:clamp(36px,5vw,72px) clamp(20px,5vw,56px); max-width:1000px; margin:0 auto;\">\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px;\">\n\n    <div style=\"background:#FBF8F1; border:1px solid #E7E0D2; border-radius:18px; padding:clamp(28px,3.5vw,40px);\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:9px; color:#b07d2f; letter-spacing:0.05em; margin-bottom:18px;\">FOCADO&nbsp;NO&nbsp;ESSENCIAL<\u002Fdiv>\n      <h3 style=\"font-family:'Instrument Serif',serif; font-weight:400; font-size:clamp(26px,3vw,38px); line-height:1.08; margin:0 0 12px; color:#211C15;\">Só o que <span style=\"font-style:italic; color:#C5821C;\">importa<\u002Fspan>.<\u002Fh3>\n      <p style=\"font-size:clamp(15.5px,1.5vw,18px); line-height:1.55; color:#5C5347; margin:0;\">Nada de mil botões nem menus escondidos. O Carcará mostra só o essencial: seus projetos, a conversa e o preview ao vivo. O resto sai da frente pra você focar no que interessa.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#FBF8F1; border:1px solid #E7E0D2; border-radius:18px; padding:clamp(28px,3.5vw,40px);\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:9px; color:#b07d2f; letter-spacing:0.05em; margin-bottom:18px;\">NÃO&nbsp;PRECISA&nbsp;SER&nbsp;DEV<\u002Fdiv>\n      <h3 style=\"font-family:'Instrument Serif',serif; font-weight:400; font-size:clamp(26px,3vw,38px); line-height:1.08; margin:0 0 12px; color:#211C15;\">Feito pra <span style=\"font-style:italic; color:#C5821C;\">qualquer um<\u002Fspan>.<\u002Fh3>\n      <p style=\"font-size:clamp(15.5px,1.5vw,18px); line-height:1.55; color:#5C5347; margin:0;\">Se você sabe descrever o que quer, o Carcará faz acontecer. Você conversa, ele cuida do código, e você acompanha o resultado na tela. Sem terminal, sem comando decorado, sem complicação.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FEATURES -->\n<section id=\"recursos\" style=\"padding:clamp(48px,6vw,90px) clamp(20px,5vw,56px); max-width:980px; margin:0 auto;\">\n  <div style=\"text-align:center;\">\n    <div style=\"font-family:'Press Start 2P',monospace; font-size:9px; color:#b07d2f; letter-spacing:0.06em; margin-bottom:14px;\">COMO&nbsp;FUNCIONA<\u002Fdiv>\n    <p style=\"font-size:clamp(15px,1.5vw,18px); line-height:1.5; color:#5C5347; max-width:36em; margin:0 auto 18px;\">Pensado pro <strong style=\"color:#211C15; font-weight:700;\">Claude Code<\u002Fstrong>, e aberto pra trabalhar com qualquer IA de código. Seus projetos, do seu jeito.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column;\">\n\n    <div style=\"display:grid; grid-template-columns:74px 1fr; gap:20px; align-items:baseline; padding:24px 0; border-top:1px solid #E7E0D2;\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:22px; color:#D99748;\">01<\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Hanken Grotesk',sans-serif; font-size:clamp(19px,2vw,24px); font-weight:800; margin:0 0 6px; color:#211C15;\">Um bando de projetos<\u002Fh3>\n        <p style=\"font-size:clamp(15px,1.4vw,17px); line-height:1.55; color:#5C5347; margin:0;\">Cada subpasta da sua pasta raiz vira um ícone no rail. Bateu o olho, achou o projeto, sem abrir cinco janelas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:74px 1fr; gap:20px; align-items:baseline; padding:24px 0; border-top:1px solid #E7E0D2;\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:22px; color:#D99748;\">02<\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Hanken Grotesk',sans-serif; font-size:clamp(19px,2vw,24px); font-weight:800; margin:0 0 6px; color:#211C15;\">A IA na pasta certa<\u002Fh3>\n        <p style=\"font-size:clamp(15px,1.4vw,17px); line-height:1.55; color:#5C5347; margin:0;\">A conversa já aponta pro projeto aberto. Feito sob medida pro Claude Code, e pronto pra trabalhar com outras IAs de código também.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:74px 1fr; gap:20px; align-items:baseline; padding:24px 0; border-top:1px solid #E7E0D2;\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:22px; color:#D99748;\">03<\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Hanken Grotesk',sans-serif; font-size:clamp(19px,2vw,24px); font-weight:800; margin:0 0 6px; color:#211C15;\">Seu site ao vivo<\u002Fh3>\n        <p style=\"font-size:clamp(15px,1.4vw,17px); line-height:1.55; color:#5C5347; margin:0;\">A IDE detecta o servidor de desenvolvimento, sobe ele e mostra seu site embutido. Se já estiver rodando, não sobe de novo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:74px 1fr; gap:20px; align-items:baseline; padding:24px 0; border-top:1px solid #E7E0D2; border-bottom:1px solid #E7E0D2;\">\n      <div style=\"font-family:'Press Start 2P',monospace; font-size:22px; color:#D99748;\">04<\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:'Hanken Grotesk',sans-serif; font-size:clamp(19px,2vw,24px); font-weight:800; margin:0 0 6px; color:#211C15;\">Vários ao mesmo tempo<\u002Fh3>\n        <p style=\"font-size:clamp(15px,1.4vw,17px); line-height:1.55; color:#5C5347; margin:0;\">Cada projeto guarda sua conversa e seu preview enquanto o app está aberto. Pule de um para outro sem perder o fio.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PHILOSOPHY -->\n<section style=\"padding:clamp(30px,5vw,64px) clamp(20px,5vw,56px);\">\n  <div style=\"max-width:760px; margin:0 auto; text-align:center;\">\n    <svg width=\"44\" height=\"44\" style=\"fill:#D99748; margin-bottom:20px;\" viewBox=\"0 0 1490 1835\"><path d=\"M371.733 46.2668L371.333 92.6669L349.333 92.8003C337.2 92.8003 316.4 93.0669 303.067 93.0669L278.667 93.3336V139.334V185.334H185.333H92V231.334V277.334H46H0V422V566.667H46H92V521.334V476H185.333H278.667V792.667V1109.33H325.333H372V1154.67V1200H418.667H465.333V1245.33V1290.67L511.733 1290.93L558 1291.33L558.4 1471.6L558.667 1652H488.667H418.667V1682V1712H395.333H372V1752V1792H406.667H441.333V1768V1744H464.667H488V1789.33V1834.67H523.333H558.667V1789.33V1744H605.333H652V1768V1792H698H744V1752V1712H698H652V1592V1472H698.4H744.667L744.533 1427.33V1382.67H837.6H930.667V1427.33V1472H976.667H1022.67V1562V1652H954H885.333V1682V1712H861.333H837.333V1752V1792H872H906.667V1768V1744H930.667H954.667V1789.33V1834.67H989.333H1024V1789.33V1744H1070H1116V1768V1792H1162.67H1209.33V1752V1712H1162.67H1116V1547.33V1382.67H1162.67H1209.33V1427.33V1472H1349.33H1489.33V1381.33V1290.67H1442.67H1396V1155.33V1020H1350H1304L1303.73 929.6L1303.33 839.334L1257.07 838.934L1210.67 838.667L1210.4 793.6L1210 748.667L1163.07 748.267L1116 748V702V656H1070H1024V611.334V566.667H977.333H930.667V422V277.334H884H837.333V231.334V185.334H884H930.667V92.6669V0.000244141H651.333H372L371.733 46.2668ZM465.067 232.267L465.333 278.667H512H558.667V232V185.334H651.333H744V232V278.667H790.667H837.333V467.334V656L744.533 656.267L651.733 656.667L651.867 702.267L652 748H512H372V612V476H418.667H465.333V423.334V370.667H418.667H372V324V277.334H325.333H278.667V232.267C278.667 207.467 279.067 186.667 279.6 186.267C280 185.734 321.867 185.467 372.533 185.6L464.667 186L465.067 232.267Z\"><\u002Fpath><\u002Fsvg>\n    <p style=\"font-family:'Instr
